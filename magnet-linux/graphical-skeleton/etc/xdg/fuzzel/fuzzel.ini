# Machine defaults; copy to ~/.config/fuzzel/fuzzel.ini to customize.
[main]
font=DejaVu Sans:size=12
terminal=foot -e
prompt="Run: "
icons-enabled=no
lines=10
width=40

[colors]
background=172331ff
text=e6edf3ff
prompt=7eb6e8ff
input=e6edf3ff
match=7eb6e8ff
selection=34465bff
selection-text=ffffffff
selection-match=7eb6e8ff
border=7eb6e8ff

[border]
width=2
radius=5
