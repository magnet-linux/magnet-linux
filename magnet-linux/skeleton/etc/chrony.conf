# Internet time client. Edit these sources to use your own NTP servers.
pool pool.ntp.org iburst
driftfile /var/lib/chrony/drift
# Correct a large initial error during the first three updates, then slew.
makestep 1.0 3
rtcsync
# Serve neither NTP nor remote chronyc commands. Local UDP queries are read-only;
# administrative commands use the private /run/chrony/chronyd.sock socket.
port 0
bindcmdaddress 127.0.0.1
bindcmdaddress ::1
